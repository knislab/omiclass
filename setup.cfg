[metadata]
name = omiclass
version = 0.0.0.dev0
description = Omics classification with explicit fitting and prediction protocols
long_description = file: README.md
long_description_content_type = text/markdown
# License intentionally unset pending the owner's decision.
license_files =

[options]
packages = find_namespace:
py_modules = api
python_requires = >=3.9
include_package_data = False
zip_safe = False
install_requires =
    numpy>=1.26,<2
    pandas>=2.2,<2.3
    scipy>=1.13,<1.14
    scikit-learn>=1.5,<1.6
    imbalanced-learn>=0.12,<0.13
    scikit-optimize>=0.10,<0.11
    xgboost>=2.1,<2.2
    lightgbm>=4.5,<4.6
    joblib>=1.4,<2
    pydantic>=2,<3
    PyYAML>=6,<7
    matplotlib>=3.7,<4
    seaborn>=0.12,<0.14
    requests>=2.31,<3
    statsmodels>=0.14,<0.15
    lifelines>=0.27,<0.31

[options.packages.find]
where = .
include = omiclass*

[options.package_data]
omiclass.batch = *.R
omiclass.de = *.R
omiclass.foundation = SOURCE_PROVENANCE.md

[options.extras_require]
foundation =
    torch>=2.2,<3
bulkformer =
    torch>=2.2,<3
    torch-geometric>=2.5,<3
    torch-sparse>=0.6,<0.7
    performer-pytorch>=1.1,<2
cellfm =
    torch>=2.2,<3
r =
    rpy2>=3.5,<3.6
io =
    pyarrow>=14
    openpyxl>=3
test =
    pytest>=8,<9
    wheel>=0.40
