name: omiclass_env
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.9
  - pip
  - setuptools>=58
  - wheel
  - numpy=1.26
  - pandas=2.2
  - scipy=1.13
  - scikit-learn=1.5
  - imbalanced-learn=0.12
  - scikit-optimize=0.10
  - xgboost=2.1
  - lightgbm=4.5
  - joblib>=1.4,<2
  - pydantic>=2,<3
  - pyyaml>=6,<7
  - matplotlib>=3.7,<4
  - seaborn>=0.12,<0.14
  - requests>=2.31,<3
  - statsmodels>=0.14,<0.15
  - lifelines>=0.27,<0.31
  - r-base=4.3
  - r-jsonlite
  - bioconductor-limma
  - bioconductor-edger
  - bioconductor-sva
  - bioconductor-biocparallel
  - rpy2>=3.5,<3.6
