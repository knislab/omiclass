name: Public synthetic tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install CPU Torch and public test dependencies
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.2,<3'
          python -m pip install '.[test]'
          python -m pip check
      - name: Collect and run public tests
        env:
          CUDA_VISIBLE_DEVICES: ''
          PYTHONDONTWRITEBYTECODE: '1'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: |
          python -m pytest --collect-only
          python -m pytest
      - name: Build wheel without dependency downloads
        run: python -m pip wheel --no-deps . -w dist
